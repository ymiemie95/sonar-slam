<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="760" viewBox="0 0 1160 760" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrowSolid" markerUnits="userSpaceOnUse" viewBox="0 0 10 10" refX="8.2" refY="5" markerWidth="6.2" markerHeight="6.2" orient="auto-start-reverse">
      <path d="M1 1L8 5L1 9" fill="none" stroke="#6B6A63" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowDash" viewBox="0 0 10 10" refX="8.2" refY="5" markerWidth="6.2" markerHeight="6.2" orient="auto-start-reverse">
      <path d="M1 1L8 5L1 9" fill="none" stroke="#B4740E" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.2" stdDeviation="1.6" flood-color="#1a1a1a" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1160" height="760" fill="#ffffff"/>

  <!-- ================= COLUMN HEADERS ================= -->
  <text x="150" y="38" font-size="13" font-weight="700" letter-spacing="0.5" fill="#5A5A57" text-anchor="middle">SENSOR INPUTS</text>
  <text x="580" y="38" font-size="13" font-weight="700" letter-spacing="0.5" fill="#5A5A57" text-anchor="middle">PING_SLAM PROCESSING PIPELINE</text>
  <text x="1040" y="38" font-size="13" font-weight="700" letter-spacing="0.5" fill="#5A5A57" text-anchor="middle">OUTPUTS</text>
  <line x1="40" y1="50" x2="1120" y2="50" stroke="#D8D6CE" stroke-width="1"/>

  <!-- ================= INPUT: Ping360 ================= -->
  <rect x="60" y="80" width="180" height="66" rx="4" fill="#F4F3EE" stroke="#8B8A82" stroke-width="1" filter="url(#softShadow)"/>
  <text x="150" y="104" font-size="14" font-weight="700" fill="#2B2B29" text-anchor="middle">Ping360 Sonar</text>
  <text x="150" y="123" font-size="11.5" fill="#6B6A63" text-anchor="middle">mechanical scanning</text>
  <text x="150" y="138" font-size="10.5" font-family="Consolas, monospace" fill="#8B8A82" text-anchor="middle">SonarEcho</text>

  <!-- ================= INPUT: IMU+DVL+Depth ================= -->
  <rect x="60" y="560" width="180" height="66" rx="4" fill="#F4F3EE" stroke="#8B8A82" stroke-width="1" filter="url(#softShadow)"/>
  <text x="150" y="584" font-size="14" font-weight="700" fill="#2B2B29" text-anchor="middle">IMU + DVL + Depth</text>
  <text x="150" y="603" font-size="11.5" fill="#6B6A63" text-anchor="middle">PX4 · WaterLinked A50</text>
  <text x="150" y="618" font-size="10.5" font-family="Consolas, monospace" fill="#8B8A82" text-anchor="middle">imu / dvl / depth</text>

  <!-- ================= PIPELINE CONTAINER ================= -->
  <rect x="330" y="66" width="500" height="560" rx="6" fill="#FBFBFA" stroke="#DAD8D0" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- ── Synthetic scan formation ── -->
  <rect x="360" y="90" width="440" height="88" rx="4" fill="#E4F3EE" stroke="#2F7C68" stroke-width="1.2" filter="url(#softShadow)"/>
  <text x="580" y="116" font-size="15" font-weight="700" fill="#1B4B3E" text-anchor="middle">Synthetic Scan Formation</text>
  <text x="580" y="135" font-size="11" font-family="Consolas, monospace" fill="#3D8570" text-anchor="middle">sonarToLaserscan</text>
  <text x="580" y="156" font-size="11.5" fill="#2F5E4F" text-anchor="middle">per-beam motion compensation + sliding-window accumulation</text>

  <!-- ── Structured interpolation densifier ── -->
  <rect x="360" y="222" width="440" height="88" rx="4" fill="#E4F3EE" stroke="#2F7C68" stroke-width="1.2" filter="url(#softShadow)"/>
  <text x="580" y="248" font-size="15" font-weight="700" fill="#1B4B3E" text-anchor="middle">Structured-Interpolation Densifier</text>
  <text x="580" y="267" font-size="11" font-family="Consolas, monospace" fill="#3D8570" text-anchor="middle">scan_densifier</text>
  <text x="580" y="288" font-size="11.5" fill="#2F5E4F" text-anchor="middle">three-gate segmentation + Cartesian ray–segment intersection</text>

  <!-- ── Scan matching + pose-graph optimization ── -->
  <rect x="360" y="354" width="440" height="98" rx="4" fill="#EAE8F7" stroke="#5849A8" stroke-width="1.2" filter="url(#softShadow)"/>
  <text x="580" y="380" font-size="15" font-weight="700" fill="#33285F" text-anchor="middle">Scan Matching + Pose-Graph Optimization</text>
  <text x="580" y="399" font-size="11" font-family="Consolas, monospace" fill="#5849A8" text-anchor="middle">slam_toolbox / Karto</text>
  <text x="580" y="420" font-size="11.5" fill="#453982" text-anchor="middle">correlative grid matching + graph SLAM (Ceres solver)</text>
  <text x="580" y="438" font-size="10.5" fill="#7167AC" text-anchor="middle" font-style="italic">third-party backend</text>

  <!-- ── EKF odometry ── -->
  <rect x="360" y="560" width="440" height="66" rx="4" fill="#FBEEDA" stroke="#B4740E" stroke-width="1.2" filter="url(#softShadow)"/>
  <text x="580" y="584" font-size="15" font-weight="700" fill="#6B4308" text-anchor="middle">EKF Odometry</text>
  <text x="580" y="603" font-size="11" font-family="Consolas, monospace" fill="#B4740E" text-anchor="middle">ekfNode</text>
  <text x="580" y="618" font-size="11.5" fill="#7A5410" text-anchor="middle">12-state NED filter · DVL + IMU + depth fusion</text>

  <!-- ================= OUTPUTS ================= -->
  <rect x="960" y="90" width="160" height="66" rx="4" fill="#FBECE6" stroke="#B4501F" stroke-width="1" filter="url(#softShadow)"/>
  <text x="1040" y="114" font-size="14" font-weight="700" fill="#7A3512" text-anchor="middle">Occupancy Grid</text>
  <text x="1040" y="133" font-size="11" fill="#9C4A1E" text-anchor="middle">2D map</text>
  <text x="1040" y="148" font-size="10.5" font-family="Consolas, monospace" fill="#B4501F" text-anchor="middle">nav_msgs/OccupancyGrid</text>

  <rect x="960" y="200" width="160" height="66" rx="4" fill="#FBECE6" stroke="#B4501F" stroke-width="1" filter="url(#softShadow)"/>
  <text x="1040" y="224" font-size="14" font-weight="700" fill="#7A3512" text-anchor="middle">Localization</text>
  <text x="1040" y="243" font-size="11" fill="#9C4A1E" text-anchor="middle">robot trajectory</text>
  <text x="1040" y="258" font-size="10.5" font-family="Consolas, monospace" fill="#B4501F" text-anchor="middle">map → odom TF</text>

  <!-- ================= SOLID DATA-FLOW ARROWS ================= -->
  <!-- Ping360 -> synthetic scan -->
  <text x="285" y="114" font-size="10.5" font-family="Consolas, monospace" fill="#6B6A63" text-anchor="middle">sonar/intensity</text>
  <line x1="240" y1="124" x2="358" y2="124" stroke="#6B6A63" stroke-width="1.4" marker-end="url(#arrowSolid)"/>

  <!-- synthetic scan -> densifier -->
  <text x="645" y="202" font-size="10.5" font-family="Consolas, monospace" fill="#6B6A63" text-anchor="middle">/scan</text>
  <line x1="580" y1="178" x2="580" y2="220" stroke="#6B6A63" stroke-width="1.4" marker-end="url(#arrowSolid)"/>

  <!-- densifier -> scan matching -->
  <text x="672" y="334" font-size="10.5" font-family="Consolas, monospace" fill="#6B6A63" text-anchor="middle">/scan_dense</text>
  <line x1="580" y1="310" x2="580" y2="352" stroke="#6B6A63" stroke-width="1.4" marker-end="url(#arrowSolid)"/>

  <!-- scan matching -> occupancy grid  (lane x=860) -->
  <path d="M800 380 L860 380 L860 123 L958 123" fill="none" stroke="#A0431C" stroke-width="1.4" marker-end="url(#arrowSolid)"/>
  <!-- scan matching -> localization  (lane x=900) -->
  <path d="M800 402 L900 402 L900 233 L958 233" fill="none" stroke="#A0431C" stroke-width="1.4" marker-end="url(#arrowSolid)"/>

  <!-- IMU/DVL/depth -> EKF -->
  <text x="285" y="592" font-size="10.5" font-family="Consolas, monospace" fill="#6B6A63" text-anchor="middle">imu / dvl / depth</text>
  <line x1="240" y1="602" x2="358" y2="602" stroke="#6B6A63" stroke-width="1.4" marker-end="url(#arrowSolid)"/>

  <!-- ================= DASHED POSE / TF ARROWS ================= -->
  <!-- EKF -> synthetic scan (motion-compensation pose), lane x=280 in the left gap -->
  <path d="M360 590 L280 590 L280 132 L358 132" fill="none" stroke="#B4740E" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arrowDash)"/>
  <rect x="130" y="332" width="150" height="38" rx="3" fill="#FDF6EA" stroke="#E3C48A" stroke-width="0.8"/>
  <text x="205" y="347" font-size="10.5" font-weight="600" fill="#8A5C0C" text-anchor="middle">publisherPoseEkf</text>
  <text x="205" y="361" font-size="10" fill="#B4740E" text-anchor="middle">(motion compensation)</text>

  <!-- EKF -> scan matching (odom->base_link TF), lane x=940 in the right gap -->
  <path d="M800 592 L940 592 L940 412 L802 412" fill="none" stroke="#B4740E" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arrowDash)"/>
  <rect x="835" y="482" width="150" height="32" rx="3" fill="#FDF6EA" stroke="#E3C48A" stroke-width="0.8"/>
  <text x="910" y="502" font-size="10.5" font-weight="600" fill="#8A5C0C" text-anchor="middle">odom → base_link TF</text>

  <!-- ================= NOTES PANEL ================= -->
  <rect x="60" y="656" width="1060" height="86" rx="5" fill="#EEF3FA" stroke="#9FB6D6" stroke-width="1"/>
  <text x="80" y="678" font-size="12.5" font-weight="700" fill="#1F477A" text-anchor="start">Notes</text>
  <text x="80" y="697" font-size="11" fill="#25507F" text-anchor="start">Solid arrows — LaserScan / occupancy-grid data flow.  Dashed arrows — EKF pose (for deskewing) and the odom → base_link transform.</text>
  <text x="80" y="713" font-size="11" fill="#25507F" text-anchor="start">TF chain: map → odom → base_link → sonar_link, jointly maintained by the EKF, scan-formation, and matching nodes.</text>
  <text x="80" y="729" font-size="11" fill="#25507F" text-anchor="start">Ablation switch: the backend subscribes to either /scan_dense (densified) or /scan (raw); window size π / 3π⁄2 / 2π (half / three-quarter / full revolution).</text>

</svg>
